findings:
  - >-
    The mandate replicated. The CDR machinery that produced Australia's fifty-bank identical banking
    contract did transplant into energy, and at Powershop it produced a working implementation, not a
    compliance page. Register entry, live conformant Discovery endpoints on the retailer's own host, and
    482 conformant plan records were all confirmed by anonymous HTTP.
  - >-
    But the shape of the transplant differs from banking in one structurally important way. In banking,
    every ADI serves its own public Product Reference Data endpoint at /cds-au/v1/banking/products. In
    energy, the retailer does NOT serve the equivalent — the AER is the designated data holder for generic
    tariff data, so the open half of the mandate is centralised on the regulator's host and 51 of 84
    registered energy brands do not even run their own CDR infrastructure. Powershop's own host answers
    only /discovery/status and /discovery/outages.
  - >-
    Compliance, not product. Powershop has zero commercial API posture: no portal, no keys, no sandbox, no
    GitHub organisation, no OpenAPI of its own, and an on-record statement that it has no public API. Every
    byte of machine-readable Powershop data that exists, exists because a statute required it. Contrast
    Octopus Energy, which built a developer portal nobody made it build.
  - >-
    The consent surface is the only thing Powershop actually operates for third parties, and it is a
    consumer UI (dashboard.cdr.powershop.com.au) rather than a developer surface. There is no way for an
    unaccredited developer to reach customer data at any price.
  - >-
    Powershop does not expose its CDR OpenID Provider metadata anonymously, unlike several Australian banks
    whose identity hosts serve /.well-known/openid-configuration openly — so the FAPI profile in use could
    not be read directly and is asserted only as the Consumer Data Standards security profile requirement.

