scope:
  fabrication: none
  note: >-
    No host, endpoint, spec or scope was invented. Every URL in apis.yml was probed and its HTTP status
    recorded above. The two OpenAPI documents are the Data Standards Body's shared sector specifications
    stored verbatim and labelled as such — Powershop authors no API contract of its own. The
    authenticated CDR consumer base URI is deliberately absent from apis.yml because it is not published
    anonymously and could not be verified.
