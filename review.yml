aid: powershop
name: Powershop
review:
  question: >-
    Does Powershop expose a real, documented public API surface, and is its Consumer Data Right
    energy obligation actually implemented or merely designated?
  answer: true
  date: '2026-07-27'
  reviewer: API Evangelist
  summary: >-
    Powershop has no commercial developer program of any kind — no portal, no keys, no self-serve docs,
    and a public statement of record that it has no public API. Its entire API surface is statutory. That
    surface is real: Powershop is listed live on the ACCC CDR Register as an energy data holder, its
    registered public base URI returns standards-conformant Consumer Data Standards responses without
    authentication, and 482 of its retail plans are retrievable anonymously from the regulator's Energy
    Made Easy CDR host. The consumer-level data the mandate exists to unlock is gated behind ACCC
    accreditation plus an authenticated consumer consent.

mandate:
  regime: cdr-energy
  regimeName: Consumer Data Right (Australia) — energy sector designation
  status: live-implemented
  homeMarket: Australia
  regulators:
    - Australian Competition and Consumer Commission (ACCC) — CDR Register and accreditation
    - Office of the Australian Information Commissioner (OAIC) — privacy safeguards
    - Data Standards Body (DSB), Treasury — Consumer Data Standards
    - Australian Energy Regulator (AER) — data holder for generic tariff data
    - Australian Energy Market Operator (AEMO) — secondary data holder for metering, NMI standing and DER data
  verificationMethod: >-
    Not accepted from a press release or a compliance page. Verified by (1) reading Powershop's own entry
    out of the public, unauthenticated ACCC CDR Register energy brand summary, and (2) calling the base
    URI that entry advertises and confirming standards-conformant HTTP 200 responses, and (3) retrieving
    real plan data through the regulator-hosted Generic Tariff endpoint. Three independent confirmations.
  registerEntry:
    source: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
    httpStatus: 200
    fetched: '2026-07-27'
    brandName: Powershop
    dataHolderBrandId: 6aaeaf9b-5132-ee11-a83d-000d3a8830d6
    interimId: 5141e4da-11cf-44ef-900b-54682bc0a49f
    industries: [energy]
    publicBaseUri: https://public.cdr.powershop.com.au
    abn: '41154914075'
    acn: '154914075'
    registerLastUpdated: '2026-07-27T06:06:56Z'
    note: >-
      84 energy brands are listed in the register. 51 of them point their publicBaseUri at the AER's
      shared host cdr.energymadeeasy.gov.au; only 33, Powershop among them, run their own CDR host.
  claimVersusImplementation: >-
    Powershop's CDR policy page asserts designated-data-holder status. That claim on its own would only
    support 'live-claimed-unverified'. It is upgraded to 'live-implemented' because the register entry and
    two live conformant endpoints on Powershop's own registered host were independently confirmed, plus a
    482-record conformant plan payload attributed to the Powershop brand. The authenticated consumer
    resources themselves could not be exercised — that requires ACCC accreditation and mutual TLS — so the
    consumer half is documented and mandated but was verified structurally, not by a successful call.

dataStandard:
  name: CDR Consumer Data Standards (Energy)
  version: 1.36.0
  documents:
    - title: CDR Energy API
      openapi: 3.0.3
      paths: 18
      local: openapi/powershop-cdr-energy-api-openapi.json
    - title: CDR Common API
      openapi: 3.0.3
      paths: 4
      local: openapi/powershop-cdr-common-api-openapi.json
  provenance: >-
    These are the shared Data Standards Body specifications that every Australian energy data holder must
    conform to. They are NOT Powershop-authored artifacts. Powershop publishes no OpenAPI of its own. The
    specs are stored here verbatim as the contract Powershop's implementation is measured against, exactly
    as the AU banking repos store the shared CDS Banking spec.
  otherStandards: >-
    No Green Button / ESPI, OpenADR, IEEE 2030.5, OCPP/OCPI or IEC CIM reference found anywhere on
    powershop.com.au or in its CDR surface.

consumerVersusMarketData:
  consumerDataApi:
    available: true
    gated: true
    gate: accredited-only
    resources:
      - /energy/accounts and /energy/accounts/{accountId}
      - /energy/accounts/{accountId}/balance and /energy/accounts/balances
      - /energy/accounts/{accountId}/invoices and /energy/accounts/invoices
      - /energy/accounts/{accountId}/billing and /energy/accounts/billing
      - /energy/accounts/{accountId}/payment-schedule
      - /energy/accounts/{accountId}/concessions
      - /energy/electricity/servicepoints and /energy/electricity/servicepoints/{servicePointId}
      - /energy/electricity/servicepoints/{servicePointId}/usage and /energy/electricity/servicepoints/usage
      - /energy/electricity/servicepoints/{servicePointId}/der and /energy/electricity/servicepoints/der
      - /common/customer and /common/customer/detail
    dataTypesPerPowershopPolicy:
      - Customer data — name, contact details, supply address, business name, ABN
      - Account data — account number, creation date, identifiers, product data, payment arrangements, concessions and rebates
      - Invoice and billing data
      - AEMO data — metering (usage) data, NMI standing data, DER (solar) register data
    note: >-
      AEMO acts as secondary data holder for the metering, NMI standing and DER register data; Powershop
      is the primary data holder the consumer authorises. No anonymous base URI is published for this
      surface — it is resolved through the CDR Register over mutual TLS by accredited participants only.
  marketDataOpen:
    available: true
    whatIsOpen: >-
      Generic tariff (retail plan) data. GET https://cdr.energymadeeasy.gov.au/powershop/cds-au/v1/energy/plans
      returned HTTP 200 anonymously with meta.totalRecords 482 — 416 ELECTRICITY and 66 GAS plans, 313
      MARKET and 169 STANDING, 297 RESIDENTIAL and 185 BUSINESS — across the Ausgrid, Endeavour, Essential
      Energy, Jemena, Citipower, Powercor, United Energy, AusNet, Multinet, Energex, SA Power Networks and
      Australian Gas Networks zones. Plan detail confirmed for planId PSH1060421MRE2@EME.
    importantCaveat: >-
      This is open RETAIL TARIFF data, not grid, system or wholesale market data — Powershop is a retailer
      and operates no network assets. It is also NOT hosted by Powershop: under the energy designation the
      AER is the data holder for generic tariff data, so the open surface lives on the regulator's host.
      Powershop's own registered host serves only Discovery. GET https://public.cdr.powershop.com.au/cds-au/v1/energy/plans
      returned HTTP 404 — confirming the split rather than contradicting it. Powershop publishes no
      open-data portal, no bulk downloads, and no wholesale or generation feed of its own.
  theSplit: >-
    Tariff data wide open to anyone with curl; customer data reachable only through ACCC accreditation and
    an authenticated consent. Both halves exist because the mandate forced them, and neither half is a
    product Powershop chose to build.

accessGate:
  gate: accredited-only
  whatADeveloperMustActuallyDo: >-
    For plan/tariff data: nothing. Call https://cdr.energymadeeasy.gov.au/powershop/cds-au/v1/energy/plans
    with an x-v header. No signup, no key, no terms click-through. For Powershop's Discovery endpoints:
    nothing — call https://public.cdr.powershop.com.au/cds-au/v1/discovery/status. For any customer data:
    become an ACCC accredited data recipient (or operate as the authorised representative or CDR
    representative of one), be listed on the CDR Register, hold register-issued mutual-TLS certificates,
    and obtain an explicit, time-bounded, scoped consumer consent per account. There is no commercial,
    partner or sandbox path around this and no Powershop-issued API key exists at any tier.
  noDeveloperProgram: >-
    Powershop runs no developer portal, no API key issuance, no sandbox and no partner API program.
    Powershop Australia stated publicly in 2017 that it had no public API and directed customers to
    download usage data from the account UI instead; nothing found in 2026 contradicts that.

authModel:
  publicEndpoints: none — no authentication, no API key, no registration; x-v version header required per CDS
  consumerEndpoints: >-
    CDR security profile — OAuth 2.0 / OpenID Connect with FAPI-grade hardening, mutual-TLS client
    authentication using CDR Register-issued certificates, PAR and JARM per the Consumer Data Standards
    security profile, plus a consumer authorisation step. Powershop's documented consumer flow: the
    accredited data recipient redirects the consumer to Powershop, identity is verified with a one-time
    password sent by email, and the consumer selects the recipient, accounts, data types (data clusters)
    and sharing duration.
  consumerDashboard: https://dashboard.cdr.powershop.com.au/
  oidcDiscovery: >-
    No anonymously reachable OpenID Provider metadata was found. /.well-known/openid-configuration was
    probed on public.cdr.powershop.com.au (404), auth.cdr.powershop.com.au (404), and api./id./secure.cdr.powershop.com.au
    (DNS did not resolve). Unlike several AU banks, Powershop does not expose its CDR identity provider
    metadata anonymously.

identity:
  legalEntity: Powershop Australia Pty Ltd
  abn: '41154914075'
  acn: '154914075'
  parent: Shell Energy Australia (Shell plc) — acquisition from Meridian Energy completed 1 February 2022
  priorOwner: Meridian Energy (New Zealand)
  tier: utility-retailer
  homeMarket: Australia
  valueChainPosition: >-
    Retail only. Powershop buys wholesale and bills the end customer; it owns no networks and no
    generation under the Powershop brand (Meridian's Australian generation assets went to Infrastructure
    Capital Group in the same 2022 transaction, not to Shell).
  electricityStates: [New South Wales, Victoria, South-East Queensland, South Australia]
  gasStates: [New South Wales, Victoria]
  statesEvidence: >-
    Derived from the distributor list inside the live CDR plan payload — Ausgrid, Endeavour and Essential
    Energy (NSW); Citipower, Powercor, United Energy, AusNet and Jemena/Multinet (VIC); Energex (QLD);
    SA Power Networks and Australian Gas Networks (SA) — not from marketing copy.
  products:
    - Electricity plans (residential and business)
    - Gas plans
    - Powerpacks prepay purchasing model
    - GreenPower renewable add-on
    - EV Day / EV Night electricity plans
  relatedBrandNotListed: >-
    Powershop New Zealand is a separate business retained by Meridian Energy. The archived
    fluxfederation/powershop-api and sponno/powershop-api GitHub repositories document that legacy NZ
    Powershop / Flux Federation API and are NOT an Australian Powershop product. They are deliberately
    excluded from apis.yml.

