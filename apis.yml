- aid: powershop:powershop-cdr-discovery-api
  name: Powershop CDR Discovery API
  description: >-
    The Consumer Data Standards Discovery endpoints served from Powershop's own registered CDR public base
    URI. This is the surface that proves the implementation exists rather than merely being designated.
    Confirmed live on 2026-07-27 with no authentication:
    GET https://public.cdr.powershop.com.au/cds-au/v1/discovery/status returned HTTP 200 with
    {"data":{"status":"OK","explanation":"All services operational"}}, and
    GET https://public.cdr.powershop.com.au/cds-au/v1/discovery/outages returned HTTP 200 with an empty
    outages array. Both responses carry the CDS data/links/meta envelope. The root path and
    /cds-au/v1/energy/plans on this host both return HTTP 404, confirming that Powershop's own public base
    URI carries only the Discovery endpoints and that tariff data lives with the regulator.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#common-apis
