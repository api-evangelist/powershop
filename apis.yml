    Round two. Contract discovery re-run against every host — no additional
    machine-readable spec, no /.well-known document, no GraphQL and no MCP
    surface exists. Artifacts derived from the two Data Standards Body
    specifications and from live probes of the Powershop and AER CDR hosts.
