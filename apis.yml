- aid: powershop:powershop-cdr-energy-consumer-data-api
  name: Powershop CDR Energy Consumer Data API
  description: >-
    The consented, accreditation-gated half of Powershop's Consumer Data Right obligation. Powershop's own
    published CDR policy names the data it shares — customer data, account data (account number, creation
    date, product data, payment arrangements, concessions and rebates), invoice and billing data, and
    AEMO-sourced data comprising metering usage data, NMI standing data and DER (solar) register data —
    which maps onto the CDR Energy API resources for accounts, balances, invoices, billing, payment
    schedules, concessions, electricity service points, usage and DER. Access requires status as an ACCC
    accredited data recipient (or an authorised representative) holding a valid CDR consent: the consumer
    is redirected from the ADR to Powershop, verifies identity with a one-time password by email, and
    selects the accounts, data types and sharing duration. The authenticated base URI is not published
    anonymously and is resolved through the CDR Register over mutual TLS, so no base URL is asserted here.
    Consents are managed at https://dashboard.cdr.powershop.com.au/ (HTTP 200 on 2026-07-27).
  humanURL: https://www.powershop.com.au/privacy-policy/cdr-policy
