aid: powershop
url: https://raw.githubusercontent.com/api-evangelist/powershop/refs/heads/main/apis.yml
name: Powershop
kind: company
description: >-
  Powershop is an Australian retail energy brand selling electricity in New South Wales, Victoria,
  south-east Queensland and South Australia, and gas in New South Wales and Victoria. It is operated by
  Powershop Australia Pty Ltd (ABN 41 154 914 075), a wholly owned Shell Energy Australia business since
  Shell completed its acquisition from Meridian Energy in February 2022. Powershop sits at the retail end
  of the energy value chain — it buys wholesale, bills the customer, and owns the customer relationship —
  and is known for its "Powerpacks" prepay purchasing model, GreenPower add-on, and EV Day/EV Night plans.
  Its API posture is entirely regulatory, not commercial: Powershop publishes NO first-party developer
  portal, no API keys, and no self-serve documentation, and has publicly said since 2017 that it has no
  public API. What it does have is a verified Consumer Data Right (CDR) energy implementation. Powershop is
  a designated CDR energy data holder listed live on the ACCC CDR Register with a public base URI of
  https://public.cdr.powershop.com.au, which returns standards-conformant Consumer Data Standards responses
  for /cds-au/v1/discovery/status and /cds-au/v1/discovery/outages without authentication. Its Generic
  Tariff (plan) data is served openly and anonymously from the Australian Energy Regulator's Energy Made
  Easy CDR host, where 482 Powershop electricity and gas plans are retrievable with no credentials at all.
  The customer-level data the mandate actually exists to unlock — accounts, billing, invoices, payment
  schedules, concessions, plus AEMO-sourced metering, NMI standing and DER register data — is real,
  documented, and reachable only by an accredited data recipient acting on an authenticated consumer
  consent. Open tariff data, closed consumer data: a mandate that was implemented, not merely claimed.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: false
  label: Hosted service · you call their endpoint
