apis:
- aid: powershop:powershop-cdr-generic-tariff-api
  name: Powershop CDR Generic Tariff (Energy Plans) API
  description: >-
    The public, unauthenticated Consumer Data Right Generic Tariff API carrying every Powershop retail
    energy plan. Under the CDR energy designation the Australian Energy Regulator — not the retailer — is
    the data holder for generic tariff data, so Powershop's plan data is served from the AER's Energy Made
    Easy CDR host rather than from Powershop's own infrastructure. Confirmed live on 2026-07-27:
    GET /cds-au/v1/energy/plans returned HTTP 200 with meta.totalRecords 482 — 416 electricity and 66 gas
    plans, 313 MARKET and 169 STANDING, 297 residential and 185 business — spanning the Ausgrid, Endeavour,
    Essential Energy, Jemena, Citipower, Powercor, United Energy, AusNet, Multinet, Energex, SA Power
    Networks and Australian Gas Networks distribution zones. GET /cds-au/v1/energy/plans/{planId} returned
    HTTP 200 for planId PSH1060421MRE2@EME. No API key, no registration, no accreditation required.
  humanURL: https://cdr.energymadeeasy.gov.au/
  baseURL: https://cdr.energymadeeasy.gov.au/powershop/cds-au/v1
