summary: >-
  No /.well-known/ discovery document of any kind is published on any Powershop
  or Powershop-CDR host, nor on the Australian Energy Regulator CDR host that
  serves Powershop's generic tariff data. All 27 probes returned 404. This is a
  complete, honest negative: Powershop publishes no security.txt, no OIDC or
  OAuth authorisation-server metadata, no api-catalog and no ai-plugin
  manifest. Consistent with the wider finding that Powershop's only API surface
  is statutory and it does not expose its CDR identity provider anonymously.
