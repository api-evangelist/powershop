first_party_note: >-
  Powershop publishes no changelog, no release notes and no API version history
  of its own — it has no developer programme to publish them to. The change
  surface for the API Powershop actually serves is the Data Standards Body's
  release train, which is binding on Powershop by regulation. That train is
  captured here, clearly attributed, exactly as this repo stores the DSB's
  OpenAPI documents as the contract Powershop implements.
scheme: semver-on-the-standards
