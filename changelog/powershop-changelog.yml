current_version: 1.36.0
current_version_note: >-
  The version of the Consumer Data Standards the two OpenAPI documents in this
  repo were harvested at. Endpoint-level versions are negotiated separately per
  request via x-v — see lifecycle/powershop-lifecycle.yml.
process: >-
  Change is governed through numbered maintenance iterations and binding
  Decisions published by the Data Standards Body, with future-dated obligation
  milestones data holders must meet. Retailers do not choose when to adopt.
