note: 'No official Powershop-hosted MCP server exists, and none is plausible — Powershop runs no developer
  programme at all. This is a candidate tool list derived from the operations that are genuinely reachable
  without credentials: the two Generic Tariff operations the Australian Energy Regulator serves for Powershop,
  and the two CDS Discovery operations on Powershop''s own registered CDR host. Every tool below requires
  the CDS x-v version header and no authentication. The 23 consented operations are deliberately excluded
  — they are unusable by an agent without ACCC accreditation and mutual TLS.'
server:
  name: powershop
  transport: http
  url: null
  hosted_by_provider: false
