    fuelType, effective, updated-since and brand, with page / page-size pagination.
  source_operation: openapi/powershop-cdr-energy-api-openapi.json#listEnergyPlans
  endpoint: GET https://cdr.energymadeeasy.gov.au/powershop/cds-au/v1/energy/plans
  headers:
    x-v: '1'
  authenticated: false
  verified_live: true
- name: get_energy_plan_detail
  description: Get full detail for one Powershop plan by planId — tariff periods, rates, discounts, incentives,
