envelope_schemas:
  note: Every response wraps its payload in the CDS envelope.
  singular: '{ data, links: Links, meta: Meta }'
  paginated: '{ data, links: LinksPaginated, meta: MetaPaginated }'
  meta_paginated_fields: [totalRecords, totalPages]
  links_paginated_fields: [self, first, prev, next, last]
graph_note: >-
  There is no join between the public plan graph and the consented account graph
  for an outside caller: EnergyAccountPlan carries plan detail inline rather than
  a foreign key into the AER-hosted planId space. Open tariff data and consented
  consumer data are two separate worlds that happen to describe the same product.
