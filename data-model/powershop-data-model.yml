  - {kind: has_one, target: EnergyPlanContractFullV3, via: 'EnergyPlanDetailV3_allOf.gasContract'}
  - {kind: has_many, target: EnergyPlanDetailV3_allOf_meteringCharges, via: 'EnergyPlanDetailV3_allOf.meteringCharges'}
- name: EnergyPlan_geography
  surface: public
  description: Where a plan is available. The distributor list is how Powershop's real state coverage was established.
  key_fields: [distributors, excludedPostcodes, includedPostcodes]
