source: >-
  openapi/powershop-cdr-energy-api-openapi.json (133 component schemas) +
  openapi/powershop-cdr-common-api-openapi.json (27 component schemas)
scope: >-
  The CDR energy entity graph Powershop implements. Two disjoint subgraphs: the
  open EnergyPlan graph (served anonymously by the AER for Powershop's 482 retail
  plans) and the consented graph rooted at EnergyAccount and EnergyServicePoint
  (reachable only by an accredited data recipient holding a consumer consent).
  Nothing here is Powershop-authored — the schemas are the Data Standards Body's.
identifiers:
- entity: EnergyPlan
  id_field: planId
  type: ASCIIString
  observed_shape: 'PSH<digits><letters>@EME — e.g. PSH1060421MRE2@EME. The @EME suffix reflects the Energy Made Easy host that serves it.'
  public: true
- entity: EnergyAccount
  id_field: accountId
  type: ASCIIString
  public: false
  note: Opaque, consent-scoped. Also carries a human accountNumber field.
- entity: EnergyServicePoint
  id_field: servicePointId
  type: ASCIIString
  public: false
  note: The National Metering Identifier (NMI) surface; values are returned by the service point list endpoints.
- entity: EnergyInvoice
  id_field: invoiceNumber
  public: false
entities:
