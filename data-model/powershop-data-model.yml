  description: A retail energy plan openly offered to the market. 482 exist for Powershop.
  key_fields: [planId, effectiveFrom, effectiveTo, lastUpdated, displayName, description, type, fuelType, brand, brandName, applicationUri]
  enumerations:
    type: [STANDING, MARKET, REGULATED]
    fuelType: [ELECTRICITY, GAS, DUAL]
