format: cds-error-list
rfc9457: false
envelope:
  media_type: application/json
  schema: ResponseErrorListV2
  shape: '{ errors: [ { code, title, detail, meta? } ] }'
  code_namespace: urn:au-cds:error:cds-all and urn:au-cds:error:cds-energy
  note: >-
    CDR does not use RFC 9457 application/problem+json. Errors are returned as a
    ResponseErrorListV2 object carrying an array of ErrorV2 items. `code` is the
    machine-readable urn discriminator, `title` is the fixed human label
    mandated by the standards, `detail` is holder-specific free text.
verified_live:
  note: >-
    Four error cases were provoked against the live endpoints rather than read
    out of the specification. The urn code strings below are quoted from those
    real responses.
  cases:
  - request: GET https://cdr.energymadeeasy.gov.au/powershop/cds-au/v1/energy/plans?page-size=1 with no x-v header
    status: 400
    body: '{"errors":[{"code":"urn:au-cds:error:cds-all:Header/Missing","title":"Missing Required Header","detail":"Header x-v must be provided"}]}'
  - request: GET https://public.cdr.powershop.com.au/cds-au/v1/discovery/status with no x-v header
    status: 400
    body: '{"errors":[{"code":"urn:au-cds:error:cds-all:Header/Missing","title":"Missing Required Header","detail":"x-v header is mandatory for CDR endpoint requests"}]}'
  - request: 'GET https://cdr.energymadeeasy.gov.au/powershop/cds-au/v1/energy/plans?page-size=1 with x-v: 9'
    status: 406
    body: '{"errors":[{"code":"urn:au-cds:error:cds-all:Header/UnsupportedVersion","title":"Unsupported Version","detail":"Header x-v greater than maximum supported [x-v=9, max=1]"}]}'
  - request: 'GET https://cdr.energymadeeasy.gov.au/powershop/cds-au/v1/energy/plans/NOTAPLAN with x-v: 3'
    status: 404
    body: '{"errors":[{"code":"urn:au-cds:error:cds-all:Resource/NotFound","title":"Resource Not Found"}]}'
    note: >-
      The specification declares "404 - Invalid Resource" for getEnergyPlanDetail;
      the AER implementation answers with Resource/NotFound. Recorded as observed.
code_strings_caveat: >-
  Only the four urn strings above were observed on the wire. For the remaining
  entries the title and the standards anchor are quoted verbatim from the
  OpenAPI response description; the urn is given only where the anchor maps
  unambiguously onto the cds-all namespace, and is left null for the
  energy-specific codes rather than guessed.
